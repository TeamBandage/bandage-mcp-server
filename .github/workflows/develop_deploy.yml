name: Deploy to EC2 (Develop)

on:
  push:
    branches:
      - develop

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: bandage-mcp-server

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ECR 전용 IAM 자격으로 러너에 AWS 자격 주입
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ECR_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ECR_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Docker 이미지 빌드 및 ECR 푸시 — 태그 이원화 (dev-<sha> + dev-latest)
      #   - dev-<short_sha> : immutable, 롤백/추적용
      #   - dev-latest      : mutable, docker compose pull 참조 포인트
      - name: Build and Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          SHA_TAG="dev-${SHORT_SHA}"
          LATEST_TAG="dev-latest"
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$SHA_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$LATEST_TAG" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$SHA_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$LATEST_TAG"

      # docker-compose.yml 과 nginx.conf 를 EC2 의 ~/bandage/ 로 동기화 (repo 가 single source of truth)
      #   nginx.conf 가 없으면 compose 의 볼륨 마운트가 깨지므로 함께 동기화한다.
      - name: Sync deploy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: rocky
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,nginx.conf"
          target: /home/rocky/bandage
          overwrite: true

      # EC2 SSH — MCP 서버 런타임 환경변수를 .env 로 주입 후 compose up
      #   BANDAGE_* 는 비밀이 아닌 런타임 설정이라 시크릿 대신 워크플로우에 직접 둔다.
      #   이미지 좌표(ECR_REGISTRY/REPOSITORY)는 compose 의 image 보간에 쓰인다.
      - name: Deploy to EC2 & Inject ENV
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          BANDAGE_HOST: "0.0.0.0"
          BANDAGE_PORT: "8000"
          BANDAGE_TRANSPORT: streamable-http
          BANDAGE_MOUNT_PATH: /mcp
          BANDAGE_LOG_LEVEL: INFO
        with:
          host: ${{ secrets.EC2_HOST }}
          username: rocky
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,AWS_REGION,BANDAGE_HOST,BANDAGE_PORT,BANDAGE_TRANSPORT,BANDAGE_MOUNT_PATH,BANDAGE_LOG_LEVEL
          script: |
            set -euo pipefail
            cd ~/bandage

            umask 077
            cat > .env <<EOF
            ECR_REGISTRY=${ECR_REGISTRY}
            ECR_REPOSITORY=${ECR_REPOSITORY}
            BANDAGE_HOST=${BANDAGE_HOST}
            BANDAGE_PORT=${BANDAGE_PORT}
            BANDAGE_TRANSPORT=${BANDAGE_TRANSPORT}
            BANDAGE_MOUNT_PATH=${BANDAGE_MOUNT_PATH}
            BANDAGE_LOG_LEVEL=${BANDAGE_LOG_LEVEL}
            EOF

            aws ecr get-login-password --region "${AWS_REGION}" \
              | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

            docker compose pull
            docker compose up -d
            docker image prune -f
