# nginx 리버스 프록시 — 외부 80 → 내부 mcp-server:8000
# EC2 인바운드는 80 만 허용하므로 MCP 서버(8000)는 직접 노출하지 않는다.
# MCP streamable-http 는 SSE 스트리밍을 사용하므로 버퍼링을 끄고
# 연결 타임아웃을 길게 둔다.

server {
    listen 80;
    server_name _;

    location / {
        # docker compose 서비스명으로 내부 DNS 해석
        proxy_pass http://mcp-server:8000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 스트리밍 응답을 위해 버퍼링·캐시 비활성화
        proxy_buffering           off;
        proxy_cache               off;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;

        # 장시간 유지되는 MCP 세션을 끊지 않도록 타임아웃 연장
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
