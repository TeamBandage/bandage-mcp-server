# EC2 배포용 compose. 워크플로우가 이 파일과 nginx.conf 를 EC2 ~/bandage/ 로
# 동기화한 뒤 compose pull && up 을 실행한다. 이미지 좌표·런타임 설정은
# 같은 디렉토리의 .env (배포 단계에서 생성) 로 주입된다.
#
# 외부 트래픽 경로: 인터넷 → nginx:80 → mcp-server:8000 (내부 네트워크)
# EC2 인바운드는 80 만 허용하므로 mcp-server 포트는 외부로 노출하지 않는다.
services:
  mcp-server:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:dev-latest
    restart: unless-stopped
    env_file:
      - .env
    # 외부 포트 매핑 없음 — 같은 compose 네트워크의 nginx 에서만 접근
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - mcp-server
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
